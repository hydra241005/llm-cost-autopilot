version: '3.8'
services:
  api:
    build:
      context: .
      target: runtime
    image: llm-cost-autopilot:api-prod
    ports:
      - '8000:8000'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - OLLAMA_URL=${OLLAMA_URL}
    volumes:
      - logs:/var/log/autopilot

  dashboard:
    build:
      context: ./dashboard
      target: runtime
    image: llm-cost-autopilot:dashboard-prod
    ports:
      - '8501:8501'
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - api

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=autopilot
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=autopilot
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  logs:
